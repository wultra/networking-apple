name: tests

on:
  push:
    branches:
      - develop
      - release/*
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: xcode-27
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
      - name: Running Tests
        env:
          CONFIG: ${{ secrets.TESTS_CONFIG }}
        run: ./scripts/test.sh -config "$CONFIG"